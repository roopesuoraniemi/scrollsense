[project]
name = "scrollsense"
version = "0.1.0"
description = "Research prototype: read a short-video feed through Gemini (video -> text package -> affect drift)"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
