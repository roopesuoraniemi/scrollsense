<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrollSense Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F5;--card:#FFFFFF;--ink:#1D2226;--mut:#5F686E;--faint:#8A9298;--line:#DCE1DF;--acc:#3E5C7A;
  --warn:#B42318;--warn-bg:#FCEBE9;--warn-line:#F1C4BE;
  --watch:#8A5A00;--watch-bg:#FBF0D9;--watch-line:#EED8A8;
  --calm:#1E7A4C;--calm-bg:#E7F3EC;--calm-line:#BEDCCA;
  --radius:10px;--gap:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141719;--card:#1C2023;--ink:#E7EAEC;--mut:#9AA3A9;--faint:#6E777D;--line:#2E3438;--acc:#9DB7D3;
  --warn:#F2A79E;--warn-bg:#3A1D1A;--warn-line:#5A2A25;
  --watch:#EBC37A;--watch-bg:#33270F;--watch-line:#4F3D18;
  --calm:#8FD3AE;--calm-bg:#13302A;--calm-line:#24503F;
}}
:root[data-theme="dark"]{
  --paper:#141719;--card:#1C2023;--ink:#E7EAEC;--mut:#9AA3A9;--faint:#6E777D;--line:#2E3438;--acc:#9DB7D3;
  --warn:#F2A79E;--warn-bg:#3A1D1A;--warn-line:#5A2A25;
  --watch:#EBC37A;--watch-bg:#33270F;--watch-line:#4F3D18;
  --calm:#8FD3AE;--calm-bg:#13302A;--calm-line:#24503F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 28px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 12px}
header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
header .tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}
#mode{font-size:13px;color:var(--faint)}
#mode.mock{color:var(--watch)}
.spacer{flex:1}
#status{font-size:13px;color:var(--mut)}
#status.err{color:var(--warn)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--mut)}

.layout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}

/* ---- phone ---- */
.phone-col{display:flex;flex-direction:column;align-items:center;gap:12px;width:388px}
.phone-row{display:flex;align-items:center;gap:10px}
.phone{width:340px;padding:12px;border-radius:38px;background:#0d0f10;box-shadow:0 0 0 1px #2a2f33,0 14px 40px rgba(0,0,0,.25)}
.screen{position:relative;width:100%;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#000 center/cover no-repeat}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#touch{position:absolute;inset:0;z-index:2;cursor:ns-resize;touch-action:none}
.chip{position:absolute;z-index:3;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
#analysing{top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;display:none}
#analysing.on{display:block}
#paused{left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;padding:8px 14px;display:none}
#paused.on{display:block}
.side{display:flex;flex-direction:column;gap:8px}
.side button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center;padding:0}
.side button:disabled{opacity:.35;cursor:default}
#pos{font-size:12px;color:var(--mut);text-align:center;white-space:nowrap}
.side #sound{font-size:15px;margin-top:10px}
.hint{font-size:12px;color:var(--mut);margin:0;text-align:center}

/* check-in card shown on the phone, as the patient sees it */
.veil{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;padding:12px;background:rgba(20,30,28,.5)}
.nudge{width:100%;background:#f6faf8;color:#20352f;border:2px solid #b9d6cb;border-radius:18px;padding:18px 14px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.nudge h2{margin:0 0 4px;font-size:18px;line-height:1.3}
.nudge p{margin:0 0 12px;color:#557069;font-size:14px}
.nudge .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nudge button{min-height:48px;padding:8px 6px;border:0;border-radius:12px;background:#e3efea;color:#1f3a33;font-weight:700;font-size:13px;line-height:1.2;cursor:pointer}
.nudge button:focus-visible{outline:3px solid #2f6b5c;outline-offset:2px}
.gone{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#f6faf8;color:#20352f}
.gone b{font-size:18px}
.gone span{font-size:14px;color:#557069}
.gone button{border:0;border-radius:12px;background:#2f6b5c;color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}

/* add a Short */
#add{display:flex;gap:6px;width:100%}
#add input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#add-msg{font-size:12px;color:var(--mut);min-height:18px;margin:-6px 0 0;width:100%}
#add-msg.err{color:var(--warn)}

/* ---- dashboard ---- */
.dash{display:flex;flex-direction:column;gap:12px;min-width:0}
.dash-label{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:0}
#signals{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
#signals.solo{grid-template-columns:minmax(0,1fr)}
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:9px 14px;background:var(--card)}
#drift{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;min-height:62px}
#drift .what b{display:block;font-size:15px}
#drift .what span{font-size:13px}
.spark{position:relative}
#drift > svg{display:none}
.spark svg{display:block;width:100%;height:46px}
.spark span{position:absolute;right:0;transform:translateY(-120%);font-size:11px;opacity:.8}
#drift.quiet .what span{color:var(--mut)}
#drift.watch{background:var(--watch-bg);border-color:var(--watch-line);color:var(--watch)}
#drift.warning{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
#nudges{background:var(--calm-bg);border-color:var(--calm-line);color:var(--calm);font-size:13px;line-height:1.6}
#nudges:empty{display:none}
#nudges b{font-weight:700}

.cards{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.empty{color:var(--mut);font-size:14px;padding:28px 0;text-align:center}
#pkg h2{font-size:17px;font-weight:700;margin:0;line-height:1.3}
#pkg .format{font-size:13px;color:var(--mut)}
#pkg blockquote{margin:12px 0;padding:2px 0 2px 12px;border-left:3px solid var(--acc);font-style:italic}
#pkg dl{margin:0}
#pkg dt{font-size:12px;color:var(--mut);margin-top:10px}
#pkg dd{margin:1px 0 0;max-width:62ch}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--mut);font-size:13px}
details dd{white-space:pre-wrap;max-height:160px;overflow:auto}
.mocknote{font-size:12px;color:var(--watch);margin:0 0 8px}
#map{display:block;width:100%;height:auto}
#map text{font:11px "Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--mut)}
.legend{font-size:12px;color:var(--mut);margin:6px 0 0}

@media (max-width:1100px){.cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .wrap{padding:0 16px 24px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .phone-col{width:100%}
  .phone{width:min(340px,calc(100vw - 92px))}
  #signals{grid-template-columns:minmax(0,1fr)}
  #drift{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ScrollSense</h1>
    <span class="tag">Demo</span>
    <span id="mode"></span>
    <span class="spacer"></span>
    <span id="status" role="status"></span>
    <button id="reset" class="btn" type="button">Reset demo</button>
  </header>

  <div class="layout">
    <section class="phone-col" aria-label="Patient's phone">
      <div class="phone-row">
        <div class="phone">
          <div class="screen" id="screen">
            <div id="player"></div>
            <div id="touch" aria-hidden="true"></div>
            <span class="chip" id="analysing">Gemini is watching...</span>
            <span class="chip" id="paused">Paused</span>
            <div id="overlay"></div>
          </div>
        </div>
        <div class="side">
          <button id="up" type="button" aria-label="Previous Short">&#9650;</button>
          <span id="pos"></span>
          <button id="down" type="button" aria-label="Next Short">&#9660;</button>
          <button id="sound" type="button" aria-label="Sound" aria-pressed="false">&#128263;</button>
        </div>
      </div>
      <p class="hint">Scroll, swipe or press the arrow keys on the phone. Tap to pause.</p>
      <form id="add">
        <input id="add-url" type="url" placeholder="Paste a YouTube Short URL" aria-label="YouTube Short URL" required>
        <button class="btn" type="submit">Add as next</button>
      </form>
      <p id="add-msg" role="status"></p>
    </section>

    <section class="dash" aria-label="Clinician view">
      <p class="dash-label">What the clinician sees</p>
      <div id="signals" class="solo">
        <div id="drift" class="panel quiet" role="status" aria-live="polite"></div>
        <div id="nudges" class="panel" aria-label="Check-ins sent to the phone"></div>
      </div>
      <div class="cards">
        <section class="card" aria-label="Text package"><div id="pkg"><div class="empty">Scroll the phone to start.</div></div></section>
        <section class="card" aria-label="Affect map">
          <svg id="map" viewBox="0 0 360 330" role="img" aria-label="Valence and arousal of the recent Shorts against the normal range"></svg>
          <p class="legend">Dashed ellipse: 1 SD normal range. Red zone: low mood (lower valence and arousal). Dots: the Shorts in the drift window.</p>
        </section>
      </div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
